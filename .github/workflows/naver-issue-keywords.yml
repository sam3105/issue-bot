name: Naver Issue Keywords Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # 24시간 내내 15분마다 실행
  workflow_dispatch: {}       # 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # latest.json을 레포에 다시 저장하려면 쓰기 권한이 필요함

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python naver_issue_keywords_bot.py

      - name: Save latest.json back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git diff --staged --quiet || git commit -m "update latest results"
          git push
