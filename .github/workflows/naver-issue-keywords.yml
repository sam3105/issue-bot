name: Naver Issue Keywords Bot

on:
  # KST 06,08,10,12,14,16,18,20,22시에 실행되도록 UTC로 환산한 시각들
  # (UTC = KST - 9시간)
  schedule:
    - cron: "0 21,23,1,3,5,7,9,11,13 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write   # state.json을 레포에 다시 저장하려면 쓰기 권한이 필요함

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python naver_issue_keywords_bot.py

      - name: Save state.json back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state.json"
          git push
